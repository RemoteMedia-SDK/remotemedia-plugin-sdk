name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # The python-buffers tests embed Python (PyO3) and import numpy.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python test dependencies
        run: python -m pip install numpy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace
      - name: cargo test python plugin feature
        run: cargo test -p remotemedia-plugin-sdk --features python-plugin
      - name: cargo test bundled uv feature
        run: cargo test -p remotemedia-py-env --features bundled-uv

  managed-python-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.7
      - uses: Swatinem/rust-cache@v2
      - name: Test managed Python and Darwin process ownership
        run: |
          cargo test --locked -p remotemedia-py-env --features bundled-uv
          UV_BINARY_PATH="$(command -v uv)" cargo test --locked -p remotemedia-py-env --features bundled-uv --test provisioning -- --ignored
          cargo test --locked -p remotemedia-shared-memory --features worker-channel --lib macos_process::tests
