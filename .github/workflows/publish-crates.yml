name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run cargo publish --dry-run"
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ "$DRY_RUN" = "true" ]; then
            extra+=(--dry-run)
          fi

          for crate in \
            crates/loadable-node-abi \
            crates/types \
            crates/traits \
            crates/py-env-manager \
            crates/plugin-sdk
          do
            echo "::group::cargo publish $crate"
            cargo publish --manifest-path "$crate/Cargo.toml" "${extra[@]}"
            echo "::endgroup::"
            if [ "$DRY_RUN" != "true" ]; then
              sleep 30
            fi
          done
