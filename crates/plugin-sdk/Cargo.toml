[package]
name = "remotemedia-plugin-sdk"
description = "Author-facing umbrella for RemoteMedia SDK loadable plugins — re-exports the FFI surface (loadable-node-abi), wire types (remotemedia-types), traits (remotemedia-traits), and the plugin_export! macro that wires a cdylib to abi_stable's root module."
# Versioned independently of the workspace because this crate re-exports
# the abi_stable FFI surface (`FfiNode`, `FfiNodeFactory`, …) and any
# break in `loadable-node-abi` is *also* a break for plugin-sdk
# consumers. Bumping the workspace's 0.4.x line for every ABI revision
# would force a churn across every in-tree crate's version metadata;
# pinning here keeps the SemVer signal where it matters.
#
# History:
#   0.11.0  re-exports loadable-node-abi 0.9.0 (device-transfer copy accounting).
#   0.10.0  re-exports loadable-node-abi 0.8.0 (fallible factory buffer contracts).
#   0.9.0   re-exports loadable-node-abi 0.7.0 (owning copy policy and ledger).
#   0.8.0   re-exports loadable-node-abi 0.6.0 (shared media and output allocation).
#   0.7.0   re-exports loadable-node-abi 0.5.0 (session context and RPC).
#   0.6.0   re-exports loadable-node-abi 0.4.0 (clock and control hooks).
#   ≤0.4.0  shared workspace version (deprecated for this crate)
#   0.5.0   re-exports loadable-node-abi 0.3.0 (FfiNode gained
#           `process_streaming` + `OutputSink`). Pre-built cdylibs
#           that linked plugin-sdk ≤ 0.4 fail abi_stable's load-time
#           layout check; plugin authors must bump their dep to
#           `remotemedia-plugin-sdk = "0.5"` and rebuild.
version = "0.11.0"
edition = "2021"
rust-version.workspace = true
authors = ["RemoteMedia SDK Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RemoteMedia-SDK/remotemedia-sdk"

[features]
test-mapped-probe = ["mapped-python", "remotemedia-py-env/test-probe"]
default = []
native-worker = ["dep:remotemedia-shared-memory", "remotemedia-shared-memory/worker-protocol", "tokio/sync", "dep:futures"]
linux-worker-supervisor = ["native-worker", "remotemedia-shared-memory/linux-worker-supervisor"]
test-native-worker = ["native-worker", "remotemedia-shared-memory/test-faults"]
mapped-python = ["native-worker", "dep:remotemedia-py-env", "dep:sha2", "dep:hex", "dep:url"]
mapped-python-uv = ["mapped-python", "remotemedia-py-env/bundled-uv"]
# Enables `python_plugin_export!` and `PythonSubprocessFactory`. Off by
# default so Rust-only plugins don't pay for the include_dir / py-env /
# dirs dep weight. Python plugin crates opt in via
# `remotemedia-plugin-sdk = { features = ["python-plugin"] }`.
python-plugin = ["dep:include_dir", "dep:remotemedia-py-env", "dep:dirs", "dep:sha2", "dep:hex", "dep:iceoryx2", "dep:libc", "dep:windows-sys"]
# Enables in-process Python execution via PyO3 (Android, and opt-in on Linux/macOS)
inprocess-python = ["dep:include_dir", "dep:remotemedia-py-env", "dep:dirs", "dep:sha2", "dep:hex", "dep:pyo3", "dep:pyo3-async-runtimes", "dep:numpy", "dep:remotemedia-python-buffers"]
# Forward bundled-uv feature flags to `remotemedia-py-env` so plugins
# that ship with a Python runtime can opt into the uv backend. Without
# either of these, `PYTHON_ENV_MODE=managed` silently falls back to
# `python -m venv + pip`, which one-at-a-time-resolves and routinely
# leaves partially-installed venvs (transformers + huggingface-hub
# version skew is the canonical failure). Plugin authors who don't
# care about size should enable `bundled-uv-embedded`.
bundled-uv = ["python-plugin", "remotemedia-py-env/bundled-uv"]
bundled-uv-embedded = ["bundled-uv", "remotemedia-py-env/bundled-uv-embedded"]

[dependencies]
remotemedia-types = { path = "../types", version = "0.4.0" }
remotemedia-traits = { path = "../traits", version = "0.4.0" }
remotemedia-shared-memory = { path = "../shared-memory", optional = true }
loadable-node-abi = { path = "../loadable-node-abi", version = "0.9.0", features = ["runtime"] }
abi_stable = "0.11"
async-ffi = { version = "0.5", features = ["abi_stable"] }
rmp-serde = "1"
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true, optional = true }

inventory = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# python-plugin feature deps (opt-in).
include_dir = { version = "0.7", optional = true }
remotemedia-py-env = { path = "../py-env-manager", version = "0.4.0", optional = true }
dirs = { version = "5", optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
url = { version = "2", optional = true }
# iceoryx2 for shared-memory IPC with the spawned Python runner.
# Cargo path-dep cycle prevents reusing remotemedia-core's multiprocess
# module directly (core depends on plugin-sdk via loadable-export, even
# though that feature isn't selected here). We re-implement just the
# wire-format helpers we need; the binary format is the IPC contract
# with the Python runner so it's effectively frozen.
iceoryx2 = { workspace = true, optional = true }

# In-process PyO3 deps (opt-in via inprocess-python feature)
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }
numpy = { workspace = true, optional = true }
remotemedia-python-buffers = { path = "../python-buffers", optional = true }

# libc is needed on Unix to kill a Python runner's process group on
# teardown, and on Linux for prctl(PR_SET_PDEATHSIG) — the kernel's hook
# to signal the runner if the host process dies before Drop runs (the
# "host got SIGKILL'd / segfaulted" safety net).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

# Windows has no parent-death signal: each runner (and the real interpreter
# a venv launcher starts) runs in its own kill-on-close job object, so it
# ends with its node or with the host process, even on a crash.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
fs2 = "0.4.3"
remotemedia-shared-memory = { path = "../shared-memory" }
# `macros` is needed for #[tokio::test]; `rt` for current_thread flavor in
# tests. The runtime dep above (`rt-multi-thread`) is what powers the
# plugin-side runtime spawned from the adapter at production runtime.
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
# `futures::executor::block_on` lets us drive the FfiFuture from a
# thread that has zero Tokio runtime in TLS — the actual condition the
# fix addresses. `#[tokio::test]` always installs a runtime in TLS, so
# we cannot rely on it to reproduce the "no reactor running" panic.
futures = { workspace = true }
async-trait = { workspace = true }

[[bin]]
name = "native-node-test-worker"
path = "tests/support/native_node_worker.rs"
required-features = ["test-native-worker"]
