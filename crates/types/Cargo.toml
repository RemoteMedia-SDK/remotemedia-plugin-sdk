[package]
name = "remotemedia-types"
description = "Wire-format data types (RuntimeData, Error, AudioSamples, ControlMessage) shared between RemoteMedia SDK hosts and loadable plugins."
version = "0.4.0"
edition = "2021"
rust-version = "1.87"
authors = ["RemoteMedia SDK Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RemoteMedia-SDK/remotemedia-sdk"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Optional: derive `schemars::JsonSchema` on wire-shape enums
# (`PixelFormat`, `VideoCodec`). Off by default — host crates that
# need schema introspection (e.g. `remotemedia-core` for the
# manifest validator) opt in. Plugins compiled against `types`
# without this feature don't pull `schemars`.
schemars = { workspace = true, optional = true }

[features]
default = []
schemars = ["dep:schemars"]

[dev-dependencies]
rmp-serde = "1"
